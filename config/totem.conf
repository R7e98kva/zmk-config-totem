CONFIG_ZMK_USB_LOGGING=n

# explicit feature flags — Zephyr 4.1 no longer auto-enables these for
# out-of-tree split shields (see zmkfirmware/zmk#3234)
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_USB=y

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# sleep after 10 minutes of idle (600,000 ms);
# reconnect may take a few seconds after waking
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
